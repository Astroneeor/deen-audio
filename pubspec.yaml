name: deen_audio
description: Halal offline-first desktop audio app
version: 0.1.0+1
publish_to: 'none'

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  just_audio_background: ^0.0.1-beta.11
  # Desktop backends: just_audio has no Linux/Windows implementation of its own.
  just_audio_media_kit: ^2.1.0          # libmpv-based player for Linux + Windows
  media_kit_libs_linux: ^1.2.1          # links system libmpv on Linux
  media_kit_libs_windows_audio: ^1.0.9  # bundles audio-only libmpv on Windows
  audio_service_mpris: ^0.2.1           # Linux MPRIS (media keys, desktop widget)
  audio_service_win: ^0.0.3             # Windows SMTC (taskbar media controls)

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Database
  path_provider: ^2.1.1
  # SQLite via Drift. package:sqlite3 3.x bundles SQLite itself through a
  # build hook (downloads a prebuilt library per platform), so no
  # *_flutter_libs package. drift 2.34 / sqlite3 3.1 are the newest releases
  # that resolve with Flutter 3.41, which pins meta 1.17: drift_dev >=2.34.6
  # (via analyzer >=13) and sqlite3 >=3.6 (via hooks 2.2) need a newer meta.
  drift: ^2.34.1
  sqlite3: ^3.1.7

  # Network + ids
  http: ^1.6.0
  uuid: ^4.6.0
  crypto: ^3.0.8

  # File System
  file_picker: ^6.1.1

  # Routing
  go_router: ^13.0.0

  # Utilities
  flutter_hooks: ^0.20.4
  hooks_riverpod: ^2.4.9
  freezed_annotation: ^3.0.0
  rxdart: ^0.28.0
  path: ^1.9.0

  # Prayer times
  adhan: ^2.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  drift_dev: ^2.34.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran/
    - assets/adhkar/
    - assets/catalog/
    - assets/fonts/
  fonts:
    # Quran text font (SIL OFL 1.1 — assets/fonts/AmiriQuran-OFL.txt).
    # Family name must match AppFonts.quranText.
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
